name: Update Market Data

# 每日收盘后自动拉取最新行情, 更新 webapp/data 底库并推送,
# 触发 Streamlit Community Cloud 自动重新部署。

on:
  schedule:
    # UTC 08:15 = 北京时间 16:15 (A股 15:00 收盘后), 仅工作日
    - cron: '15 8 * * 1-5'
  workflow_dispatch:        # 支持手动触发: Actions → Update Market Data → Run workflow

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 允许 workflow 提交并推送

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --quiet requests pandas

      - name: Fetch CSI300 daily
        working-directory: backtest
        run: python fetch_csi300.py

      - name: Fetch bond ETF (511010) daily
        working-directory: backtest
        run: python fetch_bond_etf.py

      - name: Sync CSV into webapp data dir
        run: |
          cp backtest/daily_CN_000300.csv webapp/data/daily_CN_000300.csv
          cp backtest/daily_CN_511010.csv  webapp/data/daily_CN_511010.csv
          echo "--- webapp/data ---"
          ls -la webapp/data/
          echo "--- 最新行 ---"
          tail -2 webapp/data/daily_CN_000300.csv
          tail -2 webapp/data/daily_CN_511010.csv

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add webapp/data/
            git commit -m "chore(data): auto-update market data [$(date -u +'%Y-%m-%d %H:%M UTC')]"
            git push
            echo "已推送数据更新 ✓"
          else
            echo "无数据变化 (节假日/周末已更新), 跳过提交"
          fi